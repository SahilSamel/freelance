# ==============================================================================
# NGINX Reverse Proxy Configuration for Freelance Multi-Tenant SaaS
# Handles Static UI Serving, Wildcard Tenant Subdomains, and REST API Proxying
# ==============================================================================

# Compression Settings for Fast Asset Delivery
gzip on;
gzip_vary on;
gzip_min_length 1024;
gzip_proxied any;
gzip_types
    text/plain
    text/css
    text/javascript
    application/javascript
    application/json
    application/xml
    image/svg+xml;

# Upstream Backend Pool
upstream backend_app {
    server app:8080 max_fails=3 fail_timeout=10s;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name _;

    # Maximum file upload size (e.g. for gym logos, alert media attachments)
    client_max_body_size 25M;

    # Root directory for Frontend UI static assets
    root /var/www/ui;
    index index.html;

    # --------------------------------------------------------------------------
    # 1. API Reverse Proxy Routes
    # Matches all backend REST endpoints defined across application modules
    # --------------------------------------------------------------------------
    location ~ ^/(auth|members|plan|tenant|users|alerts|roles|authorizations|audit|configurations|control|support) {
        proxy_pass http://backend_app;
        proxy_http_version 1.1;

        # Forward connection headers
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Forward Multi-Tenant header if explicitly supplied by client
        proxy_set_header X-Tenant-ID $http_x_tenant_id;

        # Timeouts for longer backend operations or batch alert dispatches
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        # Disable response buffering for fast API streaming
        proxy_buffering off;
    }

    # --------------------------------------------------------------------------
    # 2. Static Asset Caching (CSS, JS, Fonts, Images)
    # --------------------------------------------------------------------------
    location ~* \.(css|js|jpg|jpeg|png|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
        try_files $uri =404;
    }

    # --------------------------------------------------------------------------
    # 3. Single Page Application (SPA) Client-Side Router Fallback
    # Never cache index.html so users always get the freshest app shell
    # --------------------------------------------------------------------------
    location / {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
        try_files $uri $uri/ /index.html;
    }

    # --------------------------------------------------------------------------
    # 4. Healthcheck Endpoint for Reverse Proxy Monitoring
    # --------------------------------------------------------------------------
    location /healthz {
        access_log off;
        return 200 "OK\n";
        add_header Content-Type text/plain;
    }
}
