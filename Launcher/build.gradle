plugins {
    id 'java'
    id 'application'
}

group = 'launcher'
version = '1'

repositories {
    mavenCentral()
}

dependencies {
    implementation 'ch.qos.logback:logback-classic:1.5.18'

    implementation 'org.postgresql:postgresql:42.7.11'

    implementation 'org.flywaydb:flyway-core:12.8.1'
    implementation 'org.flywaydb:flyway-database-postgresql:12.8.1'

    implementation 'com.zaxxer:HikariCP:7.0.2'

    implementation 'org.hibernate.orm:hibernate-core:6.6.0.Final'
    implementation 'jakarta.persistence:jakarta.persistence-api:3.2.0'
    implementation("javax.ws.rs:javax.ws.rs-api:2.1.1")

    implementation 'org.glassfish.jersey.containers:jersey-container-grizzly2-http:3.1.7'
    implementation 'org.glassfish.jersey.inject:jersey-hk2:3.1.7'
    implementation 'org.glassfish.jersey.media:jersey-media-json-jackson:3.1.7'

    implementation project(":Common:enum")
    implementation project(":Framework:database")
    implementation project(":Framework:appcore")
    implementation project(":Framework:jaxrs")
    implementation project(":Framework:cache")
    implementation project(":Framework:configuration")
    implementation project(":Framework:event")
    implementation project(":modules:authentication:authentication-repository")
    implementation project(":modules:authentication:authentication-service")
    implementation project(":modules:authentication:authentication-endpoint")
    implementation project(":modules:authentication:authentication-dto")
    implementation project(":modules:identityManagement:identity-repository")
    implementation project(":modules:identityManagement:identity-endpoint")
    
    implementation project(":modules:authorization:authorization-endpoint")
    implementation project(":modules:authorization:authorization-service")

    implementation project(":modules:configuration:configuration-service")
    implementation project(":modules:configuration:configuration-endpoint")
    implementation project(":modules:audit:audit-repository")
    implementation project(":modules:audit:audit-service")
    implementation project(":modules:audit:audit-endpoint")
    implementation project(":modules:alerts:alerts-repository")
    implementation project(":modules:alerts:alerts-service")
    implementation project(":modules:alerts:alerts-endpoint")
}

test {
    useJUnitPlatform()
}

application {
    mainClass = 'com.freelance.launcher.Main'
}