plugins {
    id 'java'
    id 'jacoco'
}

group = 'org.example'
version = '1.0-SNAPSHOT'

repositories {
    mavenCentral()
}

dependencies {
    // DTO types — so tests can build typed request bodies without raw maps
    testImplementation project(':modules:authentication:authentication-dto')
    testImplementation project(':modules:authentication:authentication-service')
    testImplementation project(':modules:identityManagement:identity-dto')
    testImplementation project(':modules:authorization:authorization-dto')
    testImplementation project(':modules:audit:audit-dto')
    testImplementation project(':modules:configuration:configuration-dto')
    testImplementation project(':modules:alerts:alerts-dto')
    testImplementation project(':modules:tenant:tenant-dto')
    testImplementation project(':Common:enum')
    testImplementation project(':Common:error')
    testImplementation project(':Common:config')
    testImplementation project(':Framework:configuration')
    testImplementation project(':Launcher')

    // REST Assured — fluent HTTP test DSL
    testImplementation 'io.rest-assured:rest-assured:5.5.0'

    // Jackson integration — REST Assured auto-detects this and uses it for Java records/DTOs
    testImplementation 'com.fasterxml.jackson.core:jackson-databind:2.18.3'
    testImplementation 'com.fasterxml.jackson.datatype:jackson-datatype-jsr310:2.18.3'

    // JJWT for vendor token generation in integration tests
    testImplementation 'io.jsonwebtoken:jjwt-api:0.13.0'
    testRuntimeOnly 'io.jsonwebtoken:jjwt-impl:0.13.0'
    testRuntimeOnly 'io.jsonwebtoken:jjwt-jackson:0.13.0'

    // PostgreSQL JDBC Driver
    testImplementation 'org.postgresql:postgresql:42.7.11'

    // JUnit 5
    testImplementation 'org.junit.jupiter:junit-jupiter:5.11.4'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
    enabled = false
}

// ── Integration Test Task (JUnit Reports) ───────────────────────────────────
tasks.register('integrationTest', Test) {
    description = 'Runs HTTP integration tests against a locally running server.'
    group = 'verification'

    useJUnitPlatform()
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath

    // Automatically clean previous test execution reports before running
    doFirst {
        delete layout.buildDirectory.dir("reports/tests/integrationTest")
        delete layout.buildDirectory.dir("test-results/integrationTest")
    }

    testLogging {
        events 'passed', 'skipped', 'failed'
        showStandardStreams = true
        exceptionFormat = 'full'
    }

    reports {
        html.required = true
        html.outputLocation = layout.buildDirectory.dir("reports/tests/integrationTest")
        junitXml.required = true
        junitXml.outputLocation = layout.buildDirectory.dir("test-results/integrationTest")
    }
}

// ── JaCoCo Integration Code Coverage Report ─────────────────────────────────
tasks.register('jacocoIntegrationReport', JacocoReport) {
    description = 'Generates JaCoCo code coverage report for Integration Tests.'
    dependsOn tasks.named('integrationTest')
    dependsOn rootProject.subprojects.collect { it.tasks.matching { t -> t.name == 'classes' } }
    mustRunAfter rootProject.subprojects.collect { it.tasks.matching { t -> t.name == 'test' } }
    mustRunAfter rootProject.tasks.matching { t -> t.name == 'test' }

    // Automatically clean previous coverage reports before generating fresh ones
    doFirst {
        delete layout.buildDirectory.dir("reports/coverage")
    }

    // Source directories across all project modules
    additionalSourceDirs.setFrom(files(rootProject.subprojects.collect { it.sourceSets.main.allSource.srcDirs }))
    sourceDirectories.setFrom(files(rootProject.subprojects.collect { it.sourceSets.main.allSource.srcDirs }))

    // Compiled class directories across all project modules
    classDirectories.setFrom(files(rootProject.subprojects.collect { it.sourceSets.main.output }))

    // Read all execution data files across server integration and unit test executions
    executionData.setFrom(fileTree(project.rootDir) {
        include '**/build/jacoco/*.exec'
    })

    reports {
        html.required = true
        html.outputLocation = layout.buildDirectory.dir("reports/coverage/html")
        xml.required = true
        xml.outputLocation = layout.buildDirectory.file("reports/coverage/jacoco.xml")
        csv.required = true
        csv.outputLocation = layout.buildDirectory.file("reports/coverage/jacoco.csv")
    }
}

// ── Convenience Task to Wipe All Reports on Demand ──────────────────────────
tasks.register('cleanReports', Delete) {
    description = 'Wipes all test execution and code coverage reports in the testing module.'
    group = 'verification'
    delete layout.buildDirectory.dir("reports")
    delete layout.buildDirectory.dir("jacoco")
    delete layout.buildDirectory.dir("test-results")
}

