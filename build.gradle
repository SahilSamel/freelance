plugins {
    id 'java'
    id 'jacoco'
}

allprojects {
    repositories {
        mavenCentral()
    }
}

subprojects {
    apply plugin: 'java'
    apply plugin: 'jacoco'

    jacoco {
        toolVersion = "0.8.12"
    }

    test {
        jvmArgs("-Dnet.bytebuddy.experimental=true")
        jacoco {
            includes = ['com.freelance.*']
        }
    }

    tasks.withType(JavaCompile) {
        options.release = 21
        options.compilerArgs += ["-Xlint:processing"]
    }
}