plugins {
    id 'java'
}

group = 'com.freelance'
version = '1.0.0'

repositories {
    mavenCentral()
}

dependencies {
    implementation project(":modules:alerts:alerts-dto")
    implementation project(":modules:alerts:alerts-repository")
    implementation project(":modules:identityManagement:identity-service")
    implementation project(":modules:identityManagement:identity-dto")
    implementation project(":modules:identityManagement:identity-repository")
    implementation project(":Framework:appcore")
    implementation project(":Framework:event")
    implementation project(":Framework:configuration")
    implementation project(":Framework:cache")
    implementation project(":Common:config")
    implementation project(":Common:error")
    implementation project(":Common:enum")
    implementation project(":Common:dto")
    
    implementation 'jakarta.persistence:jakarta.persistence-api:3.2.0'
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.18.2'
    implementation 'com.fasterxml.jackson.datatype:jackson-datatype-jsr310:2.18.2'
    implementation 'org.slf4j:slf4j-api:2.0.16'
    implementation 'org.reflections:reflections:0.10.2'
    implementation 'jakarta.ws.rs:jakarta.ws.rs-api:3.1.0'

    testImplementation 'org.junit.jupiter:junit-jupiter:5.11.4'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
    testLogging {
        events 'passed', 'skipped', 'failed'
        exceptionFormat = 'full'
        showExceptions = true
        showCauses = true
        showStackTraces = false
    }
}