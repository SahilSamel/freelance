plugins {
    id 'java'
}

group = 'org.example'
version = 'unspecified'

repositories {
    mavenCentral()
}

dependencies {
    testImplementation platform('org.junit:junit-bom:6.0.0')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    implementation project(":modules:identityManagement:identity-dto")
    implementation project(":modules:identityManagement:identity-repository")
    implementation project(":modules:alerts:alerts-repository")
    implementation project(":Common:dto")
    implementation project(":Common:enum")
    implementation project(":Common:error")
    implementation project(":Common:config")
    implementation project(":Framework:appcore")
    implementation project(":Framework:configuration")
    implementation 'org.mindrot:jbcrypt:0.4'
    implementation 'jakarta.persistence:jakarta.persistence-api:3.2.0'
    testImplementation 'org.mockito:mockito-core:5.14.2'
    testImplementation 'org.mockito:mockito-junit-jupiter:5.14.2'
    testImplementation project(":modules:configuration:configuration-service")
}

test {
    useJUnitPlatform()
}