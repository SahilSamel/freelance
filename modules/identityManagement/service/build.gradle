plugins {
    id 'java'
}

group = 'org.example'
version = 'unspecified'

repositories {
    mavenCentral()
}

dependencies {
    testImplementation platform('org.junit:junit-bom:6.0.0')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    implementation project(":modules:IdentityManagement:identity-dto")
    implementation project(":modules:IdentityManagement:identity-repository")
    implementation project(":Common:dto")
    implementation project(":Framework:appcore")
}

test {
    useJUnitPlatform()
}