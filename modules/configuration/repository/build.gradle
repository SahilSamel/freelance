plugins {
    id 'java'
}

group = 'configuration'
version = 'unspecified'

repositories {
    mavenCentral()
}

dependencies {
    implementation 'jakarta.persistence:jakarta.persistence-api:3.1.0'
    implementation project(":Framework:appcore")
    implementation project(":Common:enum")
    implementation project(":modules:configuration:configuration-dto")
}

test {
    useJUnitPlatform()
}