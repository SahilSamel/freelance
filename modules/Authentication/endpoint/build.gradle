plugins {
    id 'java'
}

group = 'org.example'
version = '1.0-SNAPSHOT'

repositories {
    mavenCentral()
}

dependencies {
    implementation 'jakarta.ws.rs:jakarta.ws.rs-api:3.1.0'
    implementation project(":modules:Authentication:dto")
    implementation project(":modules:Authentication:service")
    implementation project(":Framework:transaction")
    implementation project(":Framework:appcore")
}

test {
    useJUnitPlatform()
}