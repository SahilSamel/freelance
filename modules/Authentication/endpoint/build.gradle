plugins {
    id 'java'
}

group = 'org.example'
version = '1.0-SNAPSHOT'

repositories {
    mavenCentral()
}

dependencies {
    implementation("javax.ws.rs:javax.ws.rs-api:2.1.1")
    implementation project(":modules:Authentication:dto")
    implementation project(":modules:Authentication:service")
}

test {
    useJUnitPlatform()
}