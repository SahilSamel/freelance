plugins {
    id 'java'
}

group = 'org.example'
version = 'unspecified'

repositories {
    mavenCentral()
}

dependencies {
    runtimeOnly 'org.postgresql:postgresql:42.7.11' // 🎯 Matched Launcher
    implementation 'org.hibernate.orm:hibernate-core:6.6.0.Final' // 🎯 Matched Launcher
    implementation 'jakarta.persistence:jakarta.persistence-api:3.2.0'
    implementation project(":Framework:appcore")
}

test {
    useJUnitPlatform()
}