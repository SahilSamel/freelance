plugins {
    id 'java'
}

group = 'org.example'
version = '1.0-SNAPSHOT'

repositories {
    mavenCentral()
}

dependencies {
    implementation project(":Framework:cache")
    implementation project(":Framework:configuration")
    implementation 'io.jsonwebtoken:jjwt-api:0.13.0'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.13.0'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.13.0'
    implementation 'ch.qos.logback:logback-classic:1.5.18'
    implementation project(":modules:authentication:authentication-dto")
    implementation project(":modules:IdentityManagement:identity-service")
    implementation project(":modules:IdentityManagement:identity-dto")
    implementation project(":Framework:appcore")
    implementation project(":Common:error")
    implementation project(":Common:config")
    implementation 'org.mindrot:jbcrypt:0.4'
}

test {
    useJUnitPlatform()
}