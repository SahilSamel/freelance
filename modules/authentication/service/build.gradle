plugins {
    id 'java'
}

group = 'org.example'
version = '1.0-SNAPSHOT'

repositories {
    mavenCentral()
}

dependencies {
    implementation project(":Framework:cache")
    implementation project(":Framework:configuration")
    implementation 'io.jsonwebtoken:jjwt-api:0.13.0'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.13.0'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.13.0'
    implementation 'ch.qos.logback:logback-classic:1.5.18'
    implementation project(":modules:authentication:authentication-dto")
    implementation project(":modules:identityManagement:identity-service")
    implementation project(":modules:identityManagement:identity-dto")
    implementation project(":Framework:appcore")
    implementation project(":Common:error")
    implementation project(":Common:config")
    implementation project(":Common:enum")
    implementation 'org.mindrot:jbcrypt:0.4'
    testImplementation 'org.junit.jupiter:junit-jupiter:5.11.4'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testImplementation 'org.mockito:mockito-core:5.14.2'
    testImplementation 'org.mockito:mockito-junit-jupiter:5.14.2'
    testImplementation 'jakarta.persistence:jakarta.persistence-api:3.1.0'
    testImplementation project(":modules:configuration:configuration-service")
}

test {
    useJUnitPlatform()
    testLogging {
        events 'passed', 'skipped', 'failed'
        exceptionFormat = 'full'
        showExceptions = true
        showCauses = true
        showStackTraces = false
    }
}