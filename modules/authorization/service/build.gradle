plugins {
    id 'java'
}

repositories {
    mavenCentral()
}

dependencies {
    implementation project(":Framework:appcore")
    implementation project(":Framework:cache")
    implementation project(":modules:authorization:authorization-dto")
    implementation project(":modules:authorization:authorization-repository")
    implementation project(":modules:identityManagement:identity-service")
    implementation project(":Common:error")
    implementation project(":Common:dto")
    implementation project(":Common:enum")
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.17.2'
    implementation 'jakarta.persistence:jakarta.persistence-api:3.1.0'
    implementation 'ch.qos.logback:logback-classic:1.5.18'
    implementation 'org.reflections:reflections:0.10.2'

    testImplementation 'org.junit.jupiter:junit-jupiter:5.11.4'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testImplementation 'org.mockito:mockito-core:5.14.2'
    testImplementation 'org.mockito:mockito-junit-jupiter:5.14.2'
    testImplementation project(":modules:authentication:authentication-endpoint")
    testImplementation project(":modules:authorization:authorization-endpoint")
}

test {
    useJUnitPlatform()
    testLogging {
        events 'passed', 'skipped', 'failed'
        exceptionFormat = 'full'
        showExceptions = true
        showCauses = true
        showStackTraces = false
    }
}
