plugins {
    id 'java'
}

group = 'com.freelance'
version = '1.0.0'

repositories {
    mavenCentral()
}

dependencies {
    implementation project(":modules:audit:audit-dto")
    implementation project(":modules:audit:audit-repository")
    implementation project(":Framework:appcore")
    implementation project(":Common:config")
    implementation project(":Common:error")
    implementation project(":Common:dto")
    implementation project(":Framework:configuration")

    testImplementation 'org.junit.jupiter:junit-jupiter:5.11.4'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testImplementation 'jakarta.persistence:jakarta.persistence-api:3.1.0'
    testImplementation project(":Framework:cache")
}

test {
    useJUnitPlatform()
    testLogging {
        events 'passed', 'skipped', 'failed'
        exceptionFormat = 'full'
        showExceptions = true
        showCauses = true
        showStackTraces = false
    }
}
