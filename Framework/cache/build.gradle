plugins {
    id 'java'
}

group = 'configuration'
version = 'unspecified'

repositories {
    mavenCentral()
}

dependencies {
    implementation 'jakarta.persistence:jakarta.persistence-api:3.1.0'
    implementation 'ch.qos.logback:logback-classic:1.5.18'
    implementation 'org.reflections:reflections:0.10.2'
}

test {
    useJUnitPlatform()
}